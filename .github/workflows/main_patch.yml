name: Build Android APK Patch

on:
  push:
    branches:
      - main
      - Patch-A
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install dependencies (termasuk Capacitor)
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 🏗️ Build Vite (web)
        run: npm run build

      - name: 📄 Buat capacitor.config.json (otomatis)
        run: |
          echo '{
            "appId": "com.example.gravity",
            "appName": "Gravity",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }' > capacitor.config.json

      - name: 📱 Setup proyek Android (hanya jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 🔧 Atasi konflik Kotlin (exclude duplikat)
        run: |
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "exclude group: 'org.jetbrains.kotlin'" android/app/build.gradle; then
              sed -i '/android {/a \
              configurations {\
                  all {\
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\
                  }\
              }' android/app/build.gradle
            fi
          fi

      - name: 🔄 Sinkronisasi Capacitor
        run: npx cap sync android

      - name: 🚀 Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 🔑 Generate signing keystore (sementara)
        run: |
          keytool -genkey -v \
            -keystore gravity-release.keystore \
            -alias gravity \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Gravity, OU=Dev, O=Gravity, L=City, S=State, C=ID"

      - name: ✍️ Sign APK dengan apksigner
        run: |
          # Temukan versi build-tools yang tersedia (pakai yang terbaru)
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks gravity-release.keystore \
            --ks-pass pass:android \
            --ks-key-alias gravity \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 🔍 Cek folder output APK
        if: always()
        run: |
          echo "=== Isi folder apk ==="
          find android/app/build/outputs/apk -type f || echo "Folder tidak ditemukan"

      - name: 📤 Upload APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: gravity-app-release-signed
          path: android/app/build/outputs/apk/release/app-release-signed.apk